<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:#FFF6E9;color:#4A3428;-webkit-font-smoothing:antialiased}
  .wrap{max-width:430px;margin:0 auto;padding:28px 20px 40px}
  .tag{display:inline-block;background:#E86A92;color:#fff;font-size:11px;letter-spacing:.14em;padding:5px 12px;border-radius:999px}

  .lead{font-size:14px;line-height:1.9;color:#7A5B4A}
  .stage{background:#FFFDF8;border:1px solid #F0DFC8;border-radius:28px;margin-top:22px;padding:26px 18px 20px;text-align:center;box-shadow:0 10px 30px rgba(201,162,39,.10)}
  .glow{width:170px;height:170px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#FFF3C4 0%,#FFE3EE 55%,rgba(255,227,238,0) 72%)}
  .stage-name{font-family:"Hiragino Mincho ProN",serif;font-size:18px;margin-top:2px}
  .stage-sub{color:#9A7B68;font-size:12px;margin-top:4px;line-height:1.7}
  h2{font-family:"Hiragino Mincho ProN",serif;font-size:18px;margin:26px 0 10px}
  .rule{background:#FFFDF8;border:1px solid #F0DFC8;border-radius:18px;padding:14px 16px;font-size:13px;line-height:1.9;margin-bottom:10px}
  .rule b{color:#E86A92}
  .status{background:#FFF1F5;border:1px dashed #F0A8C0;border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.8;margin-top:22px}
  a.btn{display:block;text-align:center;background:#E86A92;color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:999px;padding:15px;margin-top:16px}
  .foot{margin-top:26px;text-align:center;color:#9A7B68;font-size:11px;line-height:1.9}
  .foot a{color:#E86A92}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">ENAEMA EXPANSION</span>
  <h1>ねこのオーラ</h1>
  <p class="lead">育つのは、エナエマの巫女ねこ。あなたの美容タスクが進むたび、ねこのオーラの輝きが少しずつ増えていきます。</p>

  <div class="stage">

    <div class="stage-name">巫女ねこのオーラ</div>

  <div class="rule"><b>1.</b> エナエマで今日の美容タスクをこなす</div>
  <div class="rule"><b>2.</b> ねこのオーラに輝きがたまる</div>
